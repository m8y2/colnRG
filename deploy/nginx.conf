server {
    listen 80;
    server_name _;

    # Block exploit / network scanners
    if ($http_user_agent ~* libredtail-http) { return 444; }
    if ($http_user_agent ~* zgrab)          { return 444; }
    if ($http_user_agent ~* visionheight)   { return 444; }

    # Block common exploit probe paths (PHP, wp, etc.)
    location ~* /(vendor|wp-content|wp-admin|wp-includes|phpunit|laravel|wordpress|administrator|\.env|composer\.json) {
        return 444;
    }
    location ~* \.(php|phtml|php3|php4|php5|asp|aspx|jsp)$ {
        return 444;
    }
    location ~* /(xmlrpc|wlwmanifest|web\.config) {
        return 444;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 256;

    root /opt/coln-dashboard/frontend/dist;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
